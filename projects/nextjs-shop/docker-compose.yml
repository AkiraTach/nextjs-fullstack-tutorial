services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20
    # 想用本机的数据库客户端连接时，取消下面两行的注释（用 5433 避免和本机 Postgres 冲突）
    # ports:
    #   - "5433:5432"

  # 一次性任务：建表（迁移）+ 灌入演示数据，成功后退出
  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgres://shop:shop@db:5432/shop
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://shop:shop@db:5432/shop
      # 仅用于本地演示的默认密钥；部署到公网前务必换成自己的：openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:-insecure-demo-secret-change-me-before-deploying-0123456789}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      # 不设置则使用"模拟支付"；设置后走 Stripe Checkout
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
